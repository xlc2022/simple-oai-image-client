name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - os: windows-2022
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev ninja-build

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/SimpleImageClient.exe dist/
          windeployqt --release --no-translations dist/SimpleImageClient.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: mkdir -p dist && cp build/SimpleImageClient dist/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SimpleImageClient-${{ runner.os }}
          path: dist/
